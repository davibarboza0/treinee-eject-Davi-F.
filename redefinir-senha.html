<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheKa - Redefinir Senha</title>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="pagina-login">

        <!-- PAINEL ESQUERDO (MARROM) -->
        <section class="painel-ilustracao">
            <img 
                src="./laçoLogo.png" 
                alt="Ilustração do Laço TheKa" 
                class="ilustracao-laco"
            >
            <img 
                src="./botalaço.png" 
                alt="Ilustração Bota TheKa" 
                class="ilustracao-bota"
            >
            <img 
                src="./logoP.png" 
                alt="Logo TheKa" 
                class="logo"
            >
        </section>

        <!-- PAINEL DIREITO (FORMULÁRIO BRANCO DE REDEFINIÇÃO) -->
        <section class="painel-login">
            <div class="conteudo-login">

                <h1>Recuperar senha</h1>

                <form action="./index.html">
                    <div class="campo">
                        <label for="nova-senha">Nova senha</label>
                        <input
                            type="password"
                            id="nova-senha"
                            name="nova-senha"
                            placeholder="******"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="confirmar-senha">Confirmar nova senha</label>
                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="******"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="grupo-botoes">
                        <a href="./recuperar-senha.html" class="botao-voltar">Voltar</a>
                        <button type="submit" class="botao-login">Salvar</button>
                    </div>
                </form>

            </div>
        </section>

    </main>
</body>
</html>
